# The check every PR into main must pass before the instructor merges it. A course
# rule; branch protection on main also requires this check (D23, 2026-11-05).
# The JavaScript analogue of TTOD's typecheck-and-build: install from the
# lockfile, lint (ESLint + registry schema), build. No deploy job, no secrets.
name: lint-and-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-and-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
